<div class="parent">
    <div class="card">
        <h2>{{ isRegistered ? 'Login Form' : 'Registration Form' }}</h2>

        @if(isRegistered) {
            <form class="form">
                <input type="text" name="username" [(ngModel)]="loginObj.username" placeholder="Username" class="username">
                <input type="password" name="password" [(ngModel)]="loginObj.password" placeholder="Password" class="password">
                
                <button type="button" (click)="getLoginDetails()" class="login_btn">Login</button>
            </form>

            <div class="footer_card">
                <p>Not a member?</p>
                <a routerLink="/login" (click)="isRegistered = false">Signup now</a>
            </div>
        } @else {
            <form class="form">
                <input type="text" name="username" [(ngModel)]="loginObj.username" placeholder="Username" class="username">
                <input type="password" name="password" [(ngModel)]="loginObj.password" placeholder="Password" class="password">
                <input type="password" name="cnfpassword" [(ngModel)]="loginObj.cnfpassword" placeholder="Confirm Password" class="cnfpassword">
                
                <button type="button" (click)="saveLoginDetails()" class="login_btn">Register</button>
            </form>

            <div class="footer_card">
                <p>Already a member?</p>
                <!-- <a href="javascript:void(0)" (click)="isRegistered = true">Login Here</a> -->
                 <a routerLink="/login" (click)="isRegistered = true">Login Here</a>
            </div>
        }
    </div>
</div>
