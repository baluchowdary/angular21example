<div class="parent">
    <div class="card">
        <h2>{{ isRegistered ? 'Login Form' : 'Registration Form' }}</h2>

        @if(isRegistered) {
        <form class="form">
            <input type="text" name="username" [(ngModel)]="authRequestObject.username" placeholder="Username"
                class="username">
            <input type="password" name="password" [(ngModel)]="authRequestObject.password" placeholder="Password"
                class="password">

            <button type="button" (click)="getLoginDetails()" class="login_btn">Login</button>
        </form>

        <div class="footer_card">
            <p>Not a member?</p>
            <button><a routerLink="/login" (click)="isRegistered = false">Signup now</a></button>
        </div>
        } @else {

        <form class="form">
            <input type="text" name="username" [(ngModel)]="loginObj.username" placeholder="Username" class="username">
            <input type="password" name="password" [(ngModel)]="loginObj.password" placeholder="Password"
                class="password">

            <div class="role-selection my-3 px-2">
                <label class="form-label d-block text-muted small mb-2">Select Registration Role:</label>
                <div class="d-flex gap-4">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="roleAdmin" value="ROLE_ADMIN"
                            [(ngModel)]="loginObj.roles">
                        <label class="form-check-label" for="roleAdmin">Admin</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="roleLead" value="ROLE_LEAD"
                            [(ngModel)]="loginObj.roles">
                        <label class="form-check-label" for="roleLead">Lead</label>
                    </div>
                </div>
            </div>

            <button type="button" (click)="saveLoginDetails()" class="login_btn">Register</button>
        </form>


        <div class="footer_card">
            <p>Already a member?</p>
            <!-- <a href="javascript:void(0)" (click)="isRegistered = true">Login Here</a> -->
            <button><a routerLink="/login" (click)="isRegistered = true">Login Here</a></button>
        </div>
        }
    </div>
</div>
